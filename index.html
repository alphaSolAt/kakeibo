  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;


// ── バージョン ──────────────────────────────────────────
const APP_VERSION = "1.1.2";
const APP_VERSION_DATE = "2026-05-10";

// ── カテゴリデフォルト ──────────────────────────────────
const DEFAULT_INCOME_CATS  = ["給与","副収入","ボーナス","その他収入"];
const DEFAULT_EXPENSE_CATS = ["食費","外食","交通費","日用品","医療","娯楽・趣味","衣類","教育","その他支出"];

const COLOR_PALETTE = [
  "#f87171","#fb923c","#facc15","#a3e635","#4ade80","#34d399","#6ee7b7","#a7f3d0",
  "#38bdf8","#818cf8","#c084fc","#f472b6","#67e8f9","#bef264","#a5b4fc","#94a3b8",
];
const DEFAULT_CAT_COLORS = {
  "給与":"#4ade80","副収入":"#34d399","ボーナス":"#6ee7b7","その他収入":"#a7f3d0",
  "食費":"#f87171","外食":"#fb923c","交通費":"#facc15","日用品":"#a3e635",
  "医療":"#38bdf8","娯楽・趣味":"#c084fc","衣類":"#f472b6","教育":"#67e8f9","その他支出":"#94a3b8",
};

function pickColor(existingMap) {
  const used = new Set(Object.values(existingMap));
  return COLOR_PALETTE.find(c => !used.has(c)) || "#94a3b8";
}

const MONTHS = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];

function pad(n) { return String(n).padStart(2,"0"); }
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function fmtYen(n) { return "¥" + Math.abs(n).toLocaleString(); }

// ── ローカルストレージ ───────────────────────────────────
function load(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
  catch { return def; }
}
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

// ── 固定費：当月有効な金額履歴を取得 ────────────────────
// history: [{id, amount, from, to}]  from/to は "YYYY-MM"（月単位）
function activeHistory(f, yearMonth) {
  if (!f.history || f.history.length === 0) return null;
  return f.history.find(h => h.from <= yearMonth && (!h.to || h.to >= yearMonth)) || null;
}
function activeAmount(f, yearMonth) {
  const h = activeHistory(f, yearMonth);
  return h ? h.amount : 0;
}
function toYM(year, month) {
  return `${year}-${String(month+1).padStart(2,"0")}`;
}

// 旧データ移行：amount単体 → history配列に変換
function migrateFixedCosts(arr) {
  return arr.map(f => {
    if (f.history) return f; // 既に移行済み
    const fromYM = f.startDate ? f.startDate.slice(0,7) : "2020-01";
    const toYM   = f.endDate   ? f.endDate.slice(0,7)   : "";
    return {
      ...f,
      history: [{ id: Date.now() + Math.random(), amount: f.amount || 0, from: fromYM, to: toYM }],
    };
  });
}

// ── CSV エクスポート ─────────────────────────────────────
function exportCSV(transactions, fixedCosts, year, month) {
  const rows = [["日付","種別","カテゴリ","メモ","金額"]];
  transactions
    .filter(t => {
      const d = new Date(t.date);
      return (year ? d.getFullYear()===year : true) && (month!=null ? d.getMonth()===month : true);
    })
    .sort((a,b) => a.date.localeCompare(b.date))
    .forEach(t => rows.push([t.date, t.type==="income"?"収入":"支出", t.category, t.memo, t.type==="income"?t.amount:-t.amount]));
  rows.push([]);
  rows.push(["--- 固定費 ---"]);
  rows.push(["名称","金額","カテゴリ","メモ"]);
  fixedCosts.forEach(f => rows.push([f.name, -f.amount, f.category, f.memo]));
  const csv = rows.map(r => r.map(c => `"${String(c??'').replace(/"/g,'""')}"`).join(",")).join("
");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `家計簿_${year||"全期間"}_${month!=null?MONTHS[month]:"全月"}.csv`;
  a.click(); URL.revokeObjectURL(url);
}

// ── 引き落とし日のテキスト表示 ────────────────────────────
const WEEKDAY_NAMES = ["日","月","火","水","木","金","土"];
const WEEKDAY_POS   = ["第1","第2","第3","第4","最終"];

function billingLabel(f) {
  if (!f.billingType || f.billingType === "day") {
    if (!f.billingDay) return "";
    const suffix = f.nextBusinessDay ? "（土日は翌営業日）" : "";
    return `毎月${f.billingDay}日${suffix}`;
  }
  if (f.billingType === "weekday") {
    const pos  = WEEKDAY_POS[f.billingWeekPos ?? 0];
    const dow  = WEEKDAY_NAMES[f.billingDow ?? 1];
    return `毎月${pos}${dow}曜日`;
  }
  return "";
}

// 土日→翌月曜に調整
function nextBusinessDate(d) {
  const day = d.getDay();
  if (day === 6) d.setDate(d.getDate() + 2); // 土→月
  if (day === 0) d.setDate(d.getDate() + 1); // 日→月
  return d;
}

// .ics 用の最初の発生日を計算
function firstOccurrence(f) {
  const now = new Date();
  let year = now.getFullYear(), month = now.getMonth();

  if (!f.billingType || f.billingType === "day") {
    const day = f.billingDay || 1;
    let d = new Date(year, month, day);
    if (f.nextBusinessDay) d = nextBusinessDate(d);
    if (d <= now) { month++; if(month>11){month=0;year++;} d = new Date(year,month,day); if(f.nextBusinessDay) d=nextBusinessDate(d); }
    return d;
  }
  if (f.billingType === "weekday") {
    const pos = f.billingWeekPos ?? 0; // 0〜3 = 第1〜4, 4 = 最終
    const dow = f.billingDow ?? 1;     // 0=日〜6=土
    function nthWeekday(y, m) {
      if (pos === 4) { // 最終
        const last = new Date(y, m+1, 0);
        while (last.getDay() !== dow) last.setDate(last.getDate()-1);
        return last;
      }
      const first = new Date(y, m, 1);
      const diff = (dow - first.getDay() + 7) % 7;
      return new Date(y, m, 1 + diff + pos * 7);
    }
    let d = nthWeekday(year, month);
    if (d <= now) { month++; if(month>11){month=0;year++;} d = nthWeekday(year,month); }
    return d;
  }
  return new Date();
}

// ── iCSリマインダー ─────────────────────────────────────
function addToReminder(f) {
  const d = firstOccurrence(f);
  const fmt = dt => `${dt.getFullYear()}${String(dt.getMonth()+1).padStart(2,"0")}${String(dt.getDate()).padStart(2,"0")}T090000`;
  const dtStart = fmt(d);

  // RRULE生成
  let rrule = "";
  if (!f.billingType || f.billingType === "day") {
    rrule = `RRULE:FREQ=MONTHLY;BYMONTHDAY=${f.billingDay||1}`;
  } else if (f.billingType === "weekday") {
    const dowNames = ["SU","MO","TU","WE","TH","FR","SA"];
    const pos = (f.billingWeekPos ?? 0) === 4 ? -1 : (f.billingWeekPos ?? 0) + 1;
    rrule = `RRULE:FREQ=MONTHLY;BYDAY=${pos}${dowNames[f.billingDow??1]}`;
  }

  const label = billingLabel(f);
  const ics = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//家計簿//JP",
    "BEGIN:VEVENT",
    `DTSTART;TZID=Asia/Tokyo:${dtStart}`,
    rrule,
    `SUMMARY:💴 ${f.name} 引き落とし入力 (${fmtYen(f.amount)})`,
    `DESCRIPTION:固定費「${f.name}」${label}の引き落とし日です。家計簿アプリで支出を記録してください。`,
    "DURATION:PT15M",
    "BEGIN:VALARM","TRIGGER:-PT0M","ACTION:DISPLAY",
    `DESCRIPTION:💴 ${f.name} 引き落とし入力`,
    "END:VALARM","END:VEVENT","END:VCALENDAR",
  ].join("
");
  const blob = new Blob([ics], {type:"text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${f.name}_reminder.ics`;
  a.click(); URL.revokeObjectURL(url);
}

// ══════════════════════════════════════════════════════════
function App() {
  const [tab, setTab] = useState("dashboard");
  const [transactions, setTransactions] = useState(() => load("kakeibo_tx", []));
  const [fixedCosts,   setFixedCosts]   = useState(() => migrateFixedCosts(load("kakeibo_fixed", [])));
  const [incomeCats,   setIncomeCats]   = useState(() => load("kakeibo_income_cats",  DEFAULT_INCOME_CATS));
  const [expenseCats,  setExpenseCats]  = useState(() => load("kakeibo_expense_cats", DEFAULT_EXPENSE_CATS));
  const [catColors,    setCatColors]    = useState(() => load("kakeibo_cat_colors",   DEFAULT_CAT_COLORS));
  const [wallets,      setWallets]      = useState(() => load("kakeibo_wallets", [
    {id:"w1", name:"財布",    icon:"👛", color:"#facc15", initialBalance:0},
    {id:"w2", name:"Suica",   icon:"🚃", color:"#38bdf8", initialBalance:0},
    {id:"w3", name:"PayPay",  icon:"📱", color:"#f87171", initialBalance:0},
  ]));

  const now = new Date();
  const [selYear,  setSelYear]  = useState(now.getFullYear());
  const [selMonth, setSelMonth] = useState(now.getMonth());

  useEffect(() => save("kakeibo_tx",          transactions), [transactions]);
  useEffect(() => save("kakeibo_fixed",        fixedCosts),  [fixedCosts]);
  useEffect(() => save("kakeibo_income_cats",  incomeCats),  [incomeCats]);
  useEffect(() => save("kakeibo_expense_cats", expenseCats), [expenseCats]);
  useEffect(() => save("kakeibo_cat_colors",   catColors),   [catColors]);
  useEffect(() => save("kakeibo_wallets",      wallets),     [wallets]);

  const monthTx = useMemo(() =>
    transactions.filter(t => {
      const d = new Date(t.date);
      return d.getFullYear()===selYear && d.getMonth()===selMonth;
    }), [transactions, selYear, selMonth]);

  const monthIncome  = useMemo(() => monthTx.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0),  [monthTx]);
  const monthExpense = useMemo(() => monthTx.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0), [monthTx]);
  const selYM = useMemo(() => toYM(selYear, selMonth), [selYear, selMonth]);

  const fixedTotal = useMemo(() =>
    fixedCosts.reduce((s,f) => s + activeAmount(f, selYM), 0),
  [fixedCosts, selYM]);

  const balance = monthIncome - monthExpense - fixedTotal;

  const catSummary = useMemo(() => {
    const map = {};
    monthTx.filter(t=>t.type==="expense").forEach(t => { map[t.category]=(map[t.category]||0)+t.amount; });
    fixedCosts.forEach(f => {
      const amt = activeAmount(f, selYM);
      if (amt > 0) map[f.category] = (map[f.category]||0) + amt;
    });
    return Object.entries(map).sort((a,b)=>b[1]-a[1]);
  }, [monthTx, fixedCosts, selYM]);

  const totalExpAll = monthExpense + fixedTotal;

  // ウォレット残高 = 初期残高 ± 全取引の累計
  const walletBalances = useMemo(() => {
    const bal = {};
    wallets.forEach(w => { bal[w.id] = w.initialBalance; });
    transactions.forEach(t => {
      if (t.walletId && bal[t.walletId] !== undefined) {
        if (t.type === "income")   bal[t.walletId] += t.amount;
        if (t.type === "expense")  bal[t.walletId] -= t.amount;
      }
      // ウォレット間移動
      if (t.type === "transfer") {
        if (t.walletId     && bal[t.walletId]     !== undefined) bal[t.walletId]     -= t.amount;
        if (t.toWalletId   && bal[t.toWalletId]   !== undefined) bal[t.toWalletId]   += t.amount;
      }
    });
    return bal;
  }, [wallets, transactions]);

  const shared = { incomeCats, expenseCats, catColors };

  const [menuOpen, setMenuOpen] = useState(false);
  const NAV_ITEMS = [["dashboard","🏠","ダッシュボード"],["record","✏️","記録"],["wallet","👛","ウォレット"],["fixed","📌","固定費"],["history","📋","履歴"],["settings","⚙️","設定"]];

  function jumpToMonth(ym) {
    const [y,m] = ym.split("-").map(Number);
    if (!isNaN(y) && !isNaN(m) && m>=1 && m<=12) {
      setSelYear(y); setSelMonth(m-1);
    }
  }
  function goToday() {
    const n = new Date();
    setSelYear(n.getFullYear()); setSelMonth(n.getMonth());
  }

  return (
    <div style={styles.root}>
      <header style={styles.header}>
        <div style={styles.headerInner}>
          <span style={styles.logo}>家計簿</span>
          <button onClick={()=>setMenuOpen(v=>!v)} style={styles.hamburger} aria-label="メニュー">
            <span style={{...styles.hamburgerLine,...(menuOpen?{transform:"rotate(45deg) translate(5px,5px)"}:{})}} />
            <span style={{...styles.hamburgerLine,...(menuOpen?{opacity:0}:{})}} />
            <span style={{...styles.hamburgerLine,...(menuOpen?{transform:"rotate(-45deg) translate(5px,-5px)"}:{})}} />
          </button>
        </div>
      </header>
      {/* ドロワーメニュー */}
      {menuOpen && (
        <div style={styles.drawerOverlay} onClick={()=>setMenuOpen(false)}>
          <div style={styles.drawer} onClick={e=>e.stopPropagation()}>
            {NAV_ITEMS.map(([id,icon,label])=>(
              <button key={id} onClick={()=>{setTab(id);setMenuOpen(false);}}
                style={{...styles.drawerItem,...(tab===id?styles.drawerItemActive:{})}}>
                <span style={{fontSize:20}}>{icon}</span>
                <span>{label}</span>
              </button>
            ))}
          </div>
        </div>
      )}

      <main style={styles.main}>
        {/* 月ナビゲーター */}
        <div style={styles.monthBar}>
          <button style={styles.arrowBtn} onClick={()=>{ if(selMonth===0){setSelMonth(11);setSelYear(y=>y-1);}else setSelMonth(m=>m-1); }}>‹</button>
          <div style={{position:"relative",flex:1,display:"flex",justifyContent:"center"}}>
            <span style={{...styles.monthLabel,pointerEvents:"none",position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",whiteSpace:"nowrap"}}>
              {selYear}年 {MONTHS[selMonth]}
            </span>
            <input
              type="month"
              value={`${selYear}-${String(selMonth+1).padStart(2,"0")}`}
              onChange={e=>jumpToMonth(e.target.value)}
              style={{width:"100%",opacity:0,height:36,cursor:"pointer",border:"none",background:"transparent"}}
            />
          </div>
          <button style={styles.arrowBtn} onClick={()=>{ if(selMonth===11){setSelMonth(0);setSelYear(y=>y+1);}else setSelMonth(m=>m+1); }}>›</button>
          <button style={styles.todayBtn} onClick={goToday}>今月</button>
        </div>

        {tab==="dashboard" && <Dashboard {...{monthIncome,monthExpense,fixedTotal,balance,catSummary,totalExpAll,catColors,selMonth}} />}
        {tab==="record"    && <Record    {...{transactions,setTransactions,wallets,...shared}} />}
        {tab==="wallet"    && <Wallet    {...{wallets,setWallets,walletBalances,transactions,setTransactions}} />}
        {tab==="fixed"     && <Fixed     {...{fixedCosts,setFixedCosts,fixedTotal,selYM,...shared}} />}
        {tab==="history"   && <History   {...{transactions,setTransactions,catColors,incomeCats,expenseCats,wallets,selYear,selMonth}} />}
        {tab==="settings"  && <Settings  {...{incomeCats,setIncomeCats,expenseCats,setExpenseCats,catColors,setCatColors,transactions,setTransactions,fixedCosts,setFixedCosts,selYear,selMonth}} />}
      </main>

      {/* フローティング + ボタン（記録画面以外で表示） */}
      {tab!=="record" && (
        <button onClick={()=>setTab("record")} style={styles.fab} aria-label="記録する">
          ＋
        </button>
      )}
    </div>
  );
}

// ── ダッシュボード ──────────────────────────────────────
function Dashboard({monthIncome,monthExpense,fixedTotal,balance,catSummary,totalExpAll,catColors,selMonth}) {
  return (
    <div style={styles.section}>
      <div style={styles.cards}>
        <Card label="収入"    value={fmtYen(monthIncome)}  color="#4ade80" />
        <Card label="変動支出" value={fmtYen(monthExpense)} color="#f87171" />
        <Card label="固定費"  value={fmtYen(fixedTotal)}   color="#fb923c" />
        <Card label="収支" value={(balance>=0?"+":"")+fmtYen(balance)} color={balance>=0?"#4ade80":"#f87171"} big />
      </div>
      {catSummary.length>0 && (
        <div style={styles.card}>
          <h3 style={styles.cardTitle}>支出カテゴリ（{MONTHS[selMonth]}）</h3>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {catSummary.map(([cat,amt])=>{
              const pct = totalExpAll>0 ? (amt/totalExpAll*100) : 0;
              const color = catColors[cat]||"#94a3b8";
              return (
                <div key={cat}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                    <span style={{fontSize:13,color:"#cbd5e1"}}>{cat}</span>
                    <span style={{fontSize:13,color:"#f1f5f9",fontWeight:600}}>{fmtYen(amt)} <span style={{color:"#64748b",fontWeight:400}}>({pct.toFixed(1)}%)</span></span>
                  </div>
                  <div style={{height:8,borderRadius:4,background:"#1e293b"}}>
                    <div style={{height:8,borderRadius:4,width:`${pct}%`,background:color,transition:"width 0.4s"}} />
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
      {catSummary.length===0 && <p style={{color:"#475569",textAlign:"center",marginTop:40}}>この月の記録はまだありません</p>}
    </div>
  );
}

function Card({label,value,color,big}) {
  return (
    <div style={{...styles.card,...(big?{gridColumn:"1/-1"}:{}),borderTop:`3px solid ${color}`}}>
      <div style={{fontSize:12,color:"#64748b",marginBottom:6,letterSpacing:"0.05em"}}>{label}</div>
      <div style={{fontSize:big?28:22,fontWeight:700,color,fontVariantNumeric:"tabular-nums"}}>{value}</div>
    </div>
  );
}

// ── 記録フォーム ────────────────────────────────────────
function Record({transactions,setTransactions,incomeCats,expenseCats,catColors,wallets}) {
  const defaultWallet = wallets[0]?.id || "";
  const [form, setForm] = useState({type:"expense",date:today(),category:expenseCats[0]||"",memo:"",amount:"",walletId:defaultWallet,toWalletId:""});
  const [confirm, setConfirm] = useState(null);
  const cats = form.type==="income" ? incomeCats : expenseCats;
  const displayAmount = form.amount ? parseInt(form.amount,10).toLocaleString() : "";

  function handleType(t) {
    setForm(f=>({...f,type:t,
      category:t==="income"?(incomeCats[0]||""):(t==="expense"?(expenseCats[0]||""):""),
      toWalletId: t==="transfer" ? (wallets[1]?.id||"") : "",
    }));
  }
  function handleAmount(e) {
    const raw = e.target.value.replace(/[^0-9]/g,"");
    setForm(f=>({...f,amount:raw}));
  }
  function submit() {
    const amt = parseInt(form.amount,10);
    if(!form.date||isNaN(amt)||amt<=0) return;
    if(form.type==="transfer" && (!form.walletId||!form.toWalletId||form.walletId===form.toWalletId)) return;
    if((form.type==="income"||form.type==="expense")&&!form.category) return;
    setConfirm({...form,amount:amt,id:Date.now()});
  }
  function confirmSave() {
    setTransactions(prev=>[confirm,...prev]);
    setConfirm(null);
    setForm(f=>({...f,amount:"",memo:""}));
  }
  function confirmCancel() { setConfirm(null); }

  return (
    <div style={styles.section}>
      <div style={styles.card}>
        <h3 style={styles.cardTitle}>新規記録</h3>
        <div style={styles.toggle}>
          {[["expense","支出"],["income","収入"],["transfer","移動"]].map(([v,l])=>(
            <button key={v} onClick={()=>handleType(v)}
              style={{...styles.toggleBtn,...(form.type===v?{
                background:v==="income"?"#4ade80":v==="expense"?"#f87171":"#818cf8",
                color:"#0f172a",fontWeight:700
              }:{})}}>
              {l}
            </button>
          ))}
        </div>
        <div style={styles.formCol}>
          {/* ウォレット選択（最上部・1カラム） */}
          {wallets.length>0 && (
            <label style={styles.label}>{form.type==="transfer"?"移動元":"ウォレット"}
              <select value={form.walletId} onChange={e=>setForm(f=>({...f,walletId:e.target.value}))} style={styles.input}>
                <option value="">指定なし</option>
                {wallets.map(w=><option key={w.id} value={w.id}>{w.icon} {w.name}</option>)}
              </select>
            </label>
          )}
          {form.type==="transfer" && wallets.length>0 && (
            <label style={styles.label}>移動先
              <select value={form.toWalletId} onChange={e=>setForm(f=>({...f,toWalletId:e.target.value}))} style={styles.input}>
                {wallets.filter(w=>w.id!==form.walletId).map(w=><option key={w.id} value={w.id}>{w.icon} {w.name}</option>)}
              </select>
            </label>
          )}
          <div style={styles.formRow}>
            <label style={styles.label}>日付
              <input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))} style={styles.input} />
            </label>
            {form.type!=="transfer" && (
              <label style={styles.label}>カテゴリ
                <select value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))} style={styles.input}>
                  {cats.map(c=><option key={c}>{c}</option>)}
                </select>
              </label>
            )}
          </div>
          <label style={styles.label}>金額（円）
            <input
              type="text" inputMode="numeric" placeholder="0"
              value={displayAmount} onChange={handleAmount}
              style={{...styles.input,...styles.inputLarge}}
            />
          </label>
          <label style={styles.label}>メモ
            <input type="text" placeholder="任意" value={form.memo} onChange={e=>setForm(f=>({...f,memo:e.target.value}))} style={styles.input} />
          </label>
        </div>
        {(() => {
          const amt = parseInt(form.amount,10);
          const valid =
            form.date && !isNaN(amt) && amt>0 &&
            (form.type==="transfer"
              ? (form.walletId && form.toWalletId && form.walletId!==form.toWalletId)
              : form.category);
          return (
            <button onClick={submit} style={{...styles.submitBtn,...(!valid?styles.submitBtnOff:{})}} disabled={!valid}>
              記録する
            </button>
          );
        })()}
      </div>

      {/* 確認カード */}
      {confirm && (
        <div style={styles.confirmOverlay}>
          <div style={styles.confirmCard}>
            <div style={{fontSize:13,color:"#64748b",marginBottom:12,letterSpacing:"0.04em",textTransform:"uppercase",fontWeight:600}}>内容を確認</div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
              <span style={{...styles.dot,width:14,height:14,background:catColors[confirm.category]||"#818cf8"}} />
              <div style={{flex:1}}>
                <div style={{color:"#f1f5f9",fontWeight:700,fontSize:16}}>
                  {confirm.type==="transfer"
                    ? `${wallets.find(w=>w.id===confirm.walletId)?.icon||""} → ${wallets.find(w=>w.id===confirm.toWalletId)?.icon||""} 移動`
                    : confirm.category}
                </div>
                <div style={{fontSize:12,color:"#64748b"}}>
                  {confirm.date}
                  {confirm.walletId && confirm.type!=="transfer" ? " · "+(wallets.find(w=>w.id===confirm.walletId)?.icon||"")+" "+(wallets.find(w=>w.id===confirm.walletId)?.name||"") : ""}
                  {confirm.memo?" · "+confirm.memo:""}
                </div>
              </div>
              <div style={{fontSize:24,fontWeight:800,color:confirm.type==="income"?"#4ade80":confirm.type==="transfer"?"#818cf8":"#f87171"}}>
                {confirm.type==="income"?"+":confirm.type==="transfer"?"⇄":"-"}¥{confirm.amount.toLocaleString()}
              </div>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={confirmCancel} style={{...styles.submitBtn,background:"#1e293b",color:"#94a3b8",flex:1}}>修正する</button>
              <button onClick={confirmSave}   style={{...styles.submitBtn,flex:2}}>登録する</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── 固定費管理 ──────────────────────────────────────────
function Fixed({fixedCosts,setFixedCosts,fixedTotal,selYM,expenseCats,catColors}) {
  const EMPTY = {name:"",category:expenseCats[0]||"",amountStr:"",memo:"",
                 startDate:"",endDate:"",
                 billingType:"day",billingDay:"",billingWeekPos:0,billingDow:1,nextBusinessDay:false};
  const [form,       setForm]       = useState(EMPTY);
  const [confirm,    setConfirm]    = useState(null);
  const [toast,      setToast]      = useState(null);
  const [expandedId, setExpandedId] = useState(null); // 展開中の固定費ID

  const displayAmount = form.amountStr ? parseInt(form.amountStr,10).toLocaleString() : "";
  const amt = parseInt(form.amountStr,10);
  const formValid = form.name.trim() && !isNaN(amt) && amt>0 && form.startDate;

  function showToast(msg) { setToast(msg); setTimeout(()=>setToast(null),2500); }

  function openConfirm() {
    if(!formValid) return;
    let billing = { billingType: form.billingType };
    if (form.billingType==="day") {
      const d = parseInt(form.billingDay,10);
      billing.billingDay = (!isNaN(d)&&d>=1&&d<=31) ? d : null;
      billing.nextBusinessDay = form.nextBusinessDay;
    } else {
      billing.billingWeekPos = form.billingWeekPos;
      billing.billingDow = form.billingDow;
    }
    // 初期履歴：startDate〜endDate の月を from/to に変換
    const fromYM = form.startDate.slice(0,7);
    const toYM   = form.endDate ? form.endDate.slice(0,7) : "";
    const history = [{ id: Date.now(), amount: amt, from: fromYM, to: toYM }];
    setConfirm({...form,...billing,amount:amt,history,id:Date.now()+1});
  }
  function confirmSave() {
    setFixedCosts(prev=>[...prev,confirm]);
    setConfirm(null);
    setForm({...EMPTY,category:expenseCats[0]||""});
  }
  function remove(id) { setFixedCosts(prev=>prev.filter(f=>f.id!==id)); }
  function handleReminder(f) {
    addToReminder(f);
    showToast(`「${f.name}」のリマインダーをダウンロードしました。カレンダーアプリで開いてください。`);
  }
  const hasBilling = f => f.billingDay || f.billingType==="weekday";

  // アクティブ判定（当月に有効な履歴が1件以上ある）
  const isActive = f => activeAmount(f, selYM) > 0;
  const activeCosts   = fixedCosts.filter(f => isActive(f));
  const inactiveCosts = fixedCosts.filter(f => !isActive(f));

  return (
    <div style={styles.section}>
      {toast && <div style={styles.toast}>{toast}</div>}

      {/* 追加フォーム */}
      <div style={styles.card}>
        <h3 style={styles.cardTitle}>固定費を追加</h3>
        <div style={styles.formCol}>
          <div style={styles.formRow}>
            <label style={styles.label}>名称 *
              <input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="家賃、Netflix…" style={styles.input} />
            </label>
            <label style={styles.label}>カテゴリ
              <select value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))} style={styles.input}>
                {expenseCats.map(c=><option key={c}>{c}</option>)}
              </select>
            </label>
          </div>
          <label style={styles.label}>月額（円） *
            <input type="text" inputMode="numeric" value={displayAmount}
              onChange={e=>setForm(f=>({...f,amountStr:e.target.value.replace(/[^0-9]/g,"")}))}
              placeholder="0" style={{...styles.input,...styles.inputLarge}} />
          </label>
          <div style={styles.formRow}>
            <label style={styles.label}>開始月 *
              <input type="month" value={form.startDate.slice(0,7)||""} onChange={e=>setForm(f=>({...f,startDate:e.target.value+"-01"}))} style={styles.input} />
            </label>
            <label style={styles.label}>終了月（任意）
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <input type="month" value={form.endDate.slice(0,7)||""} onChange={e=>setForm(f=>({...f,endDate:e.target.value+"-01"}))} style={{...styles.input,flex:1}} />
                {form.endDate && (
                  <button onClick={()=>setForm(f=>({...f,endDate:""}))} style={{...styles.delBtn,flexShrink:0,color:"#94a3b8"}}>×</button>
                )}
              </div>
            </label>
          </div>
          <label style={styles.label}>引き落とし日
            <div style={styles.toggle}>
              {[["day","日付指定"],["weekday","曜日指定"]].map(([v,l])=>(
                <button key={v} onClick={()=>setForm(f=>({...f,billingType:v}))}
                  style={{...styles.toggleBtn,...(form.billingType===v?{background:"#818cf8",color:"#0f172a",fontWeight:700}:{})}}>
                  {l}
                </button>
              ))}
            </div>
          </label>
          {form.billingType==="day" && (
            <div style={styles.formCol}>
              <label style={styles.label}>毎月◯日
                <input type="text" inputMode="numeric" value={form.billingDay}
                  onChange={e=>setForm(f=>({...f,billingDay:e.target.value.replace(/[^0-9]/g,"")}))}
                  placeholder="例: 27" style={styles.input} />
              </label>
              <label style={{...styles.label,flexDirection:"row",alignItems:"center",gap:10,cursor:"pointer"}}>
                <input type="checkbox" checked={form.nextBusinessDay}
                  onChange={e=>setForm(f=>({...f,nextBusinessDay:e.target.checked}))}
                  style={{width:18,height:18,accentColor:"#818cf8",flexShrink:0}} />
                <span>土日の場合は翌営業日</span>
              </label>
            </div>
          )}
          {form.billingType==="weekday" && (
            <div style={styles.formRow}>
              <label style={styles.label}>週
                <select value={form.billingWeekPos} onChange={e=>setForm(f=>({...f,billingWeekPos:Number(e.target.value)}))} style={styles.input}>
                  {WEEKDAY_POS.map((l,i)=><option key={i} value={i}>{l}</option>)}
                </select>
              </label>
              <label style={styles.label}>曜日
                <select value={form.billingDow} onChange={e=>setForm(f=>({...f,billingDow:Number(e.target.value)}))} style={styles.input}>
                  {WEEKDAY_NAMES.map((l,i)=><option key={i} value={i}>{l}曜日</option>)}
                </select>
              </label>
            </div>
          )}
          <label style={styles.label}>メモ
            <input value={form.memo} onChange={e=>setForm(f=>({...f,memo:e.target.value}))} placeholder="任意" style={styles.input} />
          </label>
        </div>
        <button onClick={openConfirm} disabled={!formValid}
          style={{...styles.submitBtn,...(!formValid?styles.submitBtnOff:{})}}>
          追加する
        </button>
      </div>

      {/* 確認カード */}
      {confirm && (
        <div style={styles.confirmOverlay}>
          <div style={styles.confirmCard}>
            <div style={{fontSize:13,color:"#64748b",marginBottom:12,letterSpacing:"0.04em",textTransform:"uppercase",fontWeight:600}}>固定費を確認</div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
              <span style={{...styles.dot,width:14,height:14,background:catColors[confirm.category]||"#94a3b8"}} />
              <div style={{flex:1}}>
                <div style={{color:"#f1f5f9",fontWeight:700,fontSize:16}}>{confirm.name}</div>
                <div style={{fontSize:12,color:"#64748b"}}>
                  {confirm.category}{billingLabel(confirm) ? ` · ${billingLabel(confirm)}` : ""}
                </div>
                <div style={{fontSize:12,color:"#64748b",marginTop:2}}>
                  {confirm.history[0].from}〜{confirm.history[0].to||"終了月なし"}
                  {confirm.memo ? ` · ${confirm.memo}` : ""}
                </div>
              </div>
              <div style={{fontSize:22,fontWeight:800,color:"#fb923c"}}>
                -{fmtYen(confirm.amount)}<span style={{fontSize:12,fontWeight:400}}>/月</span>
              </div>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setConfirm(null)} style={{...styles.submitBtn,background:"#1e293b",color:"#94a3b8",flex:1}}>修正する</button>
              <button onClick={confirmSave}           style={{...styles.submitBtn,flex:2}}>登録する</button>
            </div>
          </div>
        </div>
      )}

      {/* アクティブな固定費一覧 */}
      {activeCosts.length>0 && (
        <div style={styles.card}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <h3 style={{...styles.cardTitle,marginBottom:0}}>固定費一覧</h3>
            <span style={{color:"#fb923c",fontWeight:700,fontSize:18}}>{fmtYen(fixedTotal)}/月</span>
          </div>
          {activeCosts.map(f=>(
            <FixedItem key={f.id} f={f} catColors={catColors} selYM={selYM}
              expanded={expandedId===f.id}
              onToggle={()=>setExpandedId(expandedId===f.id?null:f.id)}
              onRemove={()=>remove(f.id)}
              onReminder={()=>handleReminder(f)}
              hasBilling={hasBilling(f)}
              onUpdateHistory={hist=>setFixedCosts(prev=>prev.map(fc=>fc.id===f.id?{...fc,history:hist}:fc))}
            />
          ))}
          <p style={{fontSize:11,color:"#334155",marginTop:12,lineHeight:1.6}}>
            🔔 ボタンで .ics をダウンロード → iPhoneで開くとカレンダーアプリに毎月のリマインダーが追加されます。
          </p>
        </div>
      )}

      {/* 終了済み / 未開始 */}
      {inactiveCosts.length>0 && (
        <div style={{...styles.card,opacity:0.6}}>
          <h3 style={{...styles.cardTitle,marginBottom:12}}>終了済み / 未開始</h3>
          {inactiveCosts.map(f=>(
            <FixedItem key={f.id} f={f} catColors={catColors} selYM={selYM}
              expanded={expandedId===f.id}
              onToggle={()=>setExpandedId(expandedId===f.id?null:f.id)}
              onRemove={()=>remove(f.id)}
              onReminder={()=>handleReminder(f)}
              hasBilling={hasBilling(f)}
              onUpdateHistory={hist=>setFixedCosts(prev=>prev.map(fc=>fc.id===f.id?{...fc,history:hist}:fc))}
            />
          ))}
        </div>
      )}
    </div>
  );
}

// ── 固定費1件の表示＋金額履歴サブコンポーネント ───────
function FixedItem({f,catColors,selYM,expanded,onToggle,onRemove,onReminder,hasBilling,onUpdateHistory}) {
  const currentAmt = activeAmount(f, selYM);
  const HEMPTY = {amountStr:"",from:"",to:""};
  const [hForm,    setHForm]    = useState(HEMPTY);
  const [hEditing, setHEditing] = useState(null); // 編集中の履歴ID

  const hDisplayAmt   = hForm.amountStr ? parseInt(hForm.amountStr,10).toLocaleString() : "";
  const hAmt          = parseInt(hForm.amountStr,10);
  const hValid        = !isNaN(hAmt) && hAmt>0 && hForm.from;

  const eDisplayAmt   = hEditing ? (hEditing.amountStr ? parseInt(hEditing.amountStr,10).toLocaleString() : "") : "";
  const eAmt          = hEditing ? parseInt(hEditing.amountStr,10) : 0;
  const eValid        = hEditing && !isNaN(eAmt) && eAmt>0 && hEditing.from;

  const sortedHistory = [...(f.history||[])].sort((a,b)=>b.from.localeCompare(a.from));

  function addHistory() {
    if(!hValid) return;
    const newH = { id: Date.now(), amount: hAmt, from: hForm.from, to: hForm.to };
    onUpdateHistory([...(f.history||[]), newH]);
    setHForm(HEMPTY);
  }
  function saveEdit() {
    if(!eValid) return;
    onUpdateHistory((f.history||[]).map(h=>h.id===hEditing.id?{...hEditing,amount:eAmt}:h));
    setHEditing(null);
  }
  function removeHistory(hid) {
    onUpdateHistory((f.history||[]).filter(h=>h.id!==hid));
  }

  return (
    <div style={{borderBottom:"1px solid #1e293b"}}>
      {/* 固定費ヘッダー行 */}
      <div style={{display:"flex",alignItems:"center",gap:8,padding:"12px 0",flexWrap:"wrap"}}>
        <span style={{...styles.dot,background:catColors[f.category]||"#94a3b8",flexShrink:0}} />
        <div style={{flex:1,minWidth:0,cursor:"pointer"}} onClick={onToggle}>
          <div style={{color:"#f1f5f9",fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
            {f.name}
            <span style={{fontSize:11,color:"#475569",marginLeft:8}}>{expanded?"▲":"▼"} 金額履歴</span>
          </div>
          <div style={{fontSize:12,color:"#64748b"}}>
            {f.category}{billingLabel(f)?` · ${billingLabel(f)}`:""}
            {f.memo?` · ${f.memo}`:""}
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
          <span style={{color:"#fb923c",fontWeight:700}}>{currentAmt>0?fmtYen(currentAmt):"―"}</span>
          {hasBilling && <button onClick={onReminder} style={styles.reminderBtn}>🔔</button>}
          <button onClick={onRemove} style={styles.delBtn}>×</button>
        </div>
      </div>

      {/* 金額履歴パネル */}
      {expanded && (
        <div style={{background:"#0b1120",borderRadius:10,padding:"14px",marginBottom:12}}>
          {/* 履歴リスト */}
          <div style={{marginBottom:14}}>
            {sortedHistory.length===0 && (
              <p style={{fontSize:12,color:"#475569",textAlign:"center",padding:"8px 0"}}>履歴がありません</p>
            )}
            {sortedHistory.map(h=>(
              <div key={h.id} style={{borderBottom:"1px solid #1e293b"}}>
                {hEditing?.id===h.id ? (
                  /* 編集行 */
                  <div style={{padding:"10px 0"}}>
                    <div style={styles.formCol}>
                      <label style={styles.label}>金額（円）
                        <input type="text" inputMode="numeric"
                          value={eDisplayAmt}
                          onChange={e=>setHEditing(v=>({...v,amountStr:e.target.value.replace(/[^0-9]/g,"")}))}
                          style={{...styles.input,...styles.inputLarge}} />
                      </label>
                      <div style={styles.formRow}>
                        <label style={styles.label}>開始月
                          <input type="month" value={hEditing.from}
                            onChange={e=>setHEditing(v=>({...v,from:e.target.value}))} style={styles.input} />
                        </label>
                        <label style={styles.label}>終了月
                          <div style={{display:"flex",gap:6,alignItems:"center"}}>
                            <input type="month" value={hEditing.to}
                              onChange={e=>setHEditing(v=>({...v,to:e.target.value}))} style={{...styles.input,flex:1}} />
                            {hEditing.to && <button onClick={()=>setHEditing(v=>({...v,to:""}))} style={{...styles.delBtn,flexShrink:0,color:"#94a3b8"}}>×</button>}
                          </div>
                        </label>
                      </div>
                    </div>
                    <div style={{display:"flex",gap:8,marginTop:8}}>
                      <button onClick={()=>setHEditing(null)} style={{...styles.submitBtn,background:"#1e293b",color:"#94a3b8",flex:1,padding:"9px"}}>キャンセル</button>
                      <button onClick={saveEdit} disabled={!eValid}
                        style={{...styles.submitBtn,flex:2,padding:"9px",...(!eValid?styles.submitBtnOff:{})}}>保存</button>
                    </div>
                  </div>
                ) : (
                  /* 表示行 */
                  <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 0"}}>
                    <div style={{flex:1}}>
                      <span style={{color:"#f1f5f9",fontWeight:700,fontSize:15}}>{fmtYen(h.amount)}<span style={{fontSize:11,color:"#475569",fontWeight:400}}>/月</span></span>
                      <span style={{fontSize:11,color:"#64748b",marginLeft:10}}>{h.from}〜{h.to||"現在"}</span>
                      {activeHistory(f,selYM)?.id===h.id && (
                        <span style={{fontSize:10,color:"#4ade80",marginLeft:6,background:"#052e16",padding:"1px 6px",borderRadius:10}}>当月</span>
                      )}
                    </div>
                    <button onClick={()=>setHEditing({...h,amountStr:String(h.amount)})} style={{...styles.delBtn,color:"#93c5fd"}}>✎</button>
                    <button onClick={()=>removeHistory(h.id)} style={styles.delBtn}>×</button>
                  </div>
                )}
              </div>
            ))}
          </div>

          {/* 履歴追加フォーム */}
          <div style={{fontSize:11,color:"#475569",marginBottom:8,letterSpacing:"0.04em",textTransform:"uppercase",fontWeight:600}}>金額を追加</div>
          <div style={styles.formCol}>
            <label style={styles.label}>金額（円）
              <input type="text" inputMode="numeric" value={hDisplayAmt}
                onChange={e=>setHForm(v=>({...v,amountStr:e.target.value.replace(/[^0-9]/g,"")}))}
                placeholder="0" style={{...styles.input,...styles.inputLarge}} />
            </label>
            <div style={styles.formRow}>
              <label style={styles.label}>開始月 *
                <input type="month" value={hForm.from}
                  onChange={e=>setHForm(v=>({...v,from:e.target.value}))} style={styles.input} />
              </label>
              <label style={styles.label}>終了月
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <input type="month" value={hForm.to}
                    onChange={e=>setHForm(v=>({...v,to:e.target.value}))} style={{...styles.input,flex:1}} />
                  {hForm.to && <button onClick={()=>setHForm(v=>({...v,to:""}))} style={{...styles.delBtn,flexShrink:0,color:"#94a3b8"}}>×</button>}
                </div>
              </label>
            </div>
          </div>
          <button onClick={addHistory} disabled={!hValid}
            style={{...styles.submitBtn,marginTop:8,...(!hValid?styles.submitBtnOff:{})}}>
            履歴を追加
          </button>
        </div>
      )}
    </div>
  );
}

// ── ウォレット管理 ─────────────────────────────────────
const WALLET_ICONS = ["👛","💳","🚃","📱","🏦","💴","🪙","🛒","✈️","🎮"];

function Wallet({wallets,setWallets,walletBalances,transactions,setTransactions}) {
  const [form,    setForm]    = useState({name:"",icon:"👛",color:"#facc15",initialBalance:""});
  const [editing, setEditing] = useState(null);
  const totalBalance = wallets.reduce((s,w)=>(walletBalances[w.id]||0)+s, 0);

  function addWallet() {
    if(!form.name.trim()) return;
    const initBal = parseInt(form.initialBalance,10)||0;
    setWallets(prev=>[...prev,{...form,id:"w"+Date.now(),initialBalance:initBal}]);
    setForm({name:"",icon:"👛",color:"#facc15",initialBalance:""});
  }

// ── 履歴 ───────────────────────────────────────────────
function History({transactions,setTransactions,catColors,incomeCats,expenseCats,wallets,selYear,selMonth}) {
  const [editing, setEditing] = useState(null); // 編集中のtx

  const filtered = useMemo(() =>
    [...transactions]
      .filter(t=>{ const d=new Date(t.date); return d.getFullYear()===selYear&&d.getMonth()===selMonth; })
      .sort((a,b)=>b.date.localeCompare(a.date)),
    [transactions,selYear,selMonth]);

  function remove(id) { setTransactions(prev=>prev.filter(t=>t.id!==id)); }
  function startEdit(t) { setEditing({...t, amountStr: String(t.amount)}); }
  function cancelEdit() { setEditing(null); }
  function saveEdit() {
    const amt = parseInt(editing.amountStr,10);
    if(!editing.date||isNaN(amt)||amt<=0) return;
    setTransactions(prev=>prev.map(t=>t.id===editing.id ? {...editing,amount:amt} : t));
    setEditing(null);
  }

  const editCats = editing ? (editing.type==="income" ? incomeCats : expenseCats) : [];
  const editDisplayAmt = editing ? (editing.amountStr ? parseInt(editing.amountStr,10).toLocaleString() : "") : "";

  if(filtered.length===0) return (
    <div style={styles.section}><p style={{color:"#475569",textAlign:"center",marginTop:40}}>この月の記録はありません</p></div>
  );

  return (
    <div style={styles.section}>
      <div style={styles.card}>
        <h3 style={styles.cardTitle}>取引履歴（{filtered.length}件）</h3>
        {filtered.map(t=>(
          <div key={t.id}>
            {editing?.id===t.id ? (
              /* 編集フォーム */
              <div style={{padding:"12px 0",borderBottom:"1px solid #1e293b"}}>
                <div style={styles.formCol}>
                  <div style={styles.formRow}>
                    <label style={styles.label}>日付
                      <input type="date" value={editing.date} onChange={e=>setEditing(v=>({...v,date:e.target.value}))} style={styles.input} />
                    </label>
                    <label style={styles.label}>カテゴリ
                      <select value={editing.category} onChange={e=>setEditing(v=>({...v,category:e.target.value}))} style={styles.input}>
                        {editCats.map(c=><option key={c}>{c}</option>)}
                      </select>
                    </label>
                  </div>
                  <label style={styles.label}>金額（円）
                    <input
                      type="text" inputMode="numeric"
                      value={editDisplayAmt}
                      onChange={e=>setEditing(v=>({...v,amountStr:e.target.value.replace(/[^0-9]/g,"")}))}
                      style={{...styles.input,...styles.inputLarge}}
                    />
                  </label>
                  <label style={styles.label}>メモ
                    <input type="text" value={editing.memo} onChange={e=>setEditing(v=>({...v,memo:e.target.value}))} style={styles.input} />
                  </label>
                </div>
                <div style={{display:"flex",gap:8}}>
                  <button onClick={cancelEdit} style={{...styles.submitBtn,background:"#1e293b",color:"#94a3b8",flex:1}}>キャンセル</button>
                  {(() => {
                    const amt = parseInt(editing.amountStr,10);
                    const valid = editing.date && !isNaN(amt) && amt>0 && editing.category;
                    return (
                      <button onClick={saveEdit} disabled={!valid}
                        style={{...styles.submitBtn,flex:2,...(!valid?styles.submitBtnOff:{})}}>
                        保存
                      </button>
                    );
                  })()}
                </div>
              </div>
            ) : (
              /* 通常表示 */
              <div style={styles.txRow}>
                <div style={{display:"flex",alignItems:"center",gap:10,flex:1,minWidth:0}}>
                  <span style={{...styles.dot,background:catColors[t.category]||"#94a3b8",flexShrink:0}} />
                  <div style={{minWidth:0}}>
                    <div style={{color:"#f1f5f9",fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                      {t.type==="transfer"
                        ? `${wallets.find(w=>w.id===t.walletId)?.icon||""} → ${wallets.find(w=>w.id===t.toWalletId)?.icon||""} 移動`
                        : t.category}
                      {t.memo?" · "+t.memo:""}
                    </div>
                    <div style={{fontSize:12,color:"#64748b"}}>
                      {t.date}
                      {t.walletId && t.type!=="transfer" ? " · "+(wallets.find(w=>w.id===t.walletId)?.icon||"")+" "+(wallets.find(w=>w.id===t.walletId)?.name||"") : ""}
                    </div>
                  </div>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
                  <span style={{color:t.type==="income"?"#4ade80":t.type==="transfer"?"#818cf8":"#f87171",fontWeight:700}}>
                    {t.type==="income"?"+":t.type==="transfer"?"⇄":"-"}{fmtYen(t.amount)}
                  </span>
                  <button onClick={()=>startEdit(t)} style={{...styles.delBtn,color:"#93c5fd"}}>✎</button>
                  <button onClick={()=>remove(t.id)} style={styles.delBtn}>×</button>
                </div>
              </div>
            )}

        ))}
      </div>
    </div>
  );
}

// ── Google Drive API ────────────────────────────────────
const DRIVE_API = "https://www.googleapis.com/drive/v3";
const DRIVE_UPLOAD = "https://www.googleapis.com/upload/drive/v3";
const BACKUP_FILENAME = "kakeibo_backup.json";

async function getDriveToken() {
  // Google Identity Services経由でアクセストークンを取得
  return new Promise((resolve, reject) => {
    if (!window.google?.accounts?.oauth2) { reject(new Error("Google APIが読み込まれていません")); return; }
    const client = window.google.accounts.oauth2.initTokenClient({
      client_id: window._gClientId || "",
      scope: "https://www.googleapis.com/auth/drive.file",
      callback: (resp) => {
        if (resp.error) reject(new Error(resp.error));
        else resolve(resp.access_token);
      },
    });
    client.requestAccessToken();
  });
}

async function findBackupFile(token) {
  const res = await fetch(`${DRIVE_API}/files?q=name='${BACKUP_FILENAME}'+and+trashed=false&fields=files(id,name,modifiedTime)`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  const data = await res.json();
  return data.files?.[0] || null;
}

async function saveJsonToDrive(token, jsonStr, existingFileId) {
  const meta = { name: BACKUP_FILENAME, mimeType: "application/json" };
  const blob = new Blob([jsonStr], { type: "application/json" });
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify(meta)], { type: "application/json" }));
  form.append("file", blob);
  const url = existingFileId
    ? `${DRIVE_UPLOAD}/files/${existingFileId}?uploadType=multipart`
    : `${DRIVE_UPLOAD}/files?uploadType=multipart`;
  const method = existingFileId ? "PATCH" : "POST";
  const res = await fetch(url, { method, headers: { Authorization: `Bearer ${token}` }, body: form });
  if (!res.ok) throw new Error("保存に失敗しました");
  return await res.json();
}

async function loadJsonFromDrive(token, fileId) {
  const res = await fetch(`${DRIVE_API}/files/${fileId}?alt=media`, {
    headers: { Authorization: `Bearer ${token}` }
  });
  if (!res.ok) throw new Error("読み込みに失敗しました");
  return await res.json();
}

// ── 設定（カテゴリカスタマイズ ＋ バックアップ） ────────
function Settings({
  incomeCats,setIncomeCats,expenseCats,setExpenseCats,catColors,setCatColors,
  transactions,setTransactions,fixedCosts,setFixedCosts,
  selYear,selMonth,
}) {
  const [newIncome,  setNewIncome]  = useState("");
  const [newExpense, setNewExpense] = useState("");
  const [driveStatus, setDriveStatus] = useState("idle"); // idle | loading | ok | error
  const [driveMsg,    setDriveMsg]    = useState("");
  const [clientId,    setClientId]    = useState(() => localStorage.getItem("kakeibo_gcid") || "");
  const [showClientId, setShowClientId] = useState(false);

  function addCat(type) {
    const name = (type==="income" ? newIncome : newExpense).trim();
    if(!name) return;
    const color = pickColor(catColors);
    setCatColors(prev=>({...prev,[name]:color}));
    if(type==="income") {
      if(!incomeCats.includes(name)) setIncomeCats(prev=>[...prev,name]);
      setNewIncome("");
    } else {
      if(!expenseCats.includes(name)) setExpenseCats(prev=>[...prev,name]);
      setNewExpense("");
    }
  }
  function removeCat(type, name) {
    if(type==="income") setIncomeCats(prev=>prev.filter(c=>c!==name));
    else                setExpenseCats(prev=>prev.filter(c=>c!==name));
  }
  function changeColor(name, color) { setCatColors(prev=>({...prev,[name]:color})); }

  function saveClientId() {
    localStorage.setItem("kakeibo_gcid", clientId);
    window._gClientId = clientId;
    setShowClientId(false);
    setDriveMsg("クライアントIDを保存しました");
  }

  function buildBackup() {
    return JSON.stringify({ transactions, fixedCosts, incomeCats, expenseCats, catColors, savedAt: new Date().toISOString() }, null, 2);
  }

  function restoreBackup(data) {
    if (data.transactions) setTransactions(data.transactions);
    if (data.fixedCosts)   setFixedCosts(data.fixedCosts);
    if (data.incomeCats)   setIncomeCats(data.incomeCats);
    if (data.expenseCats)  setExpenseCats(data.expenseCats);
    if (data.catColors)    setCatColors(data.catColors);
  }

  // ── JSON ダウンロード（ローカル）
  function exportJSON() {
    const blob = new Blob([buildBackup()], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = BACKUP_FILENAME; a.click();
    URL.revokeObjectURL(url);
  }

  // ── JSON インポート（ローカルファイル）
  function importJSON(e) {
    const file = e.target.files?.[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        restoreBackup(data);
        setDriveMsg("JSONを取り込みました ✓");
      } catch { setDriveMsg("JSONの読み込みに失敗しました"); }
    };
    reader.readAsText(file);
    e.target.value = "";
  }

  // ── CSV インポート（ローカルファイル）
  function importCSV(e) {
    const file = e.target.files?.[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const text = ev.target.result.replace(/^\uFEFF/, "");
        const lines = text.split(/?
/).filter(l => l.trim() && !l.startsWith('"---'));
        const header = lines[0].split(",").map(h => h.replace(/"/g,"").trim());
        const newTx = [];
        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].match(/(".*?"|[^,]+)(?=,|$)/g);
          if (!cols || cols.length < 5) continue;
          const clean = cols.map(c => c.replace(/^"|"$/g,"").replace(/""/g,'"').trim());
          const [date, typeLabel, category, memo, amtStr] = clean;
          const amt = parseInt(amtStr, 10);
          if (!date || isNaN(amt)) continue;
          const type = typeLabel === "収入" ? "income" : "expense";
          newTx.push({ id: Date.now() + i, date, type, category, memo, amount: Math.abs(amt) });
        }
        setTransactions(prev => {
          const ids = new Set(prev.map(t => t.date + t.category + t.amount));
          const unique = newTx.filter(t => !ids.has(t.date + t.category + t.amount));
          return [...prev, ...unique];
        });
        setDriveMsg(`CSVから${newTx.length}件を取り込みました ✓`);
      } catch { setDriveMsg("CSVの読み込みに失敗しました"); }
    };
    reader.readAsText(file, "UTF-8");
    e.target.value = "";
  }

  // ── Google Drive: 保存
  async function saveToDrive() {
    setDriveStatus("loading"); setDriveMsg("Google Driveに保存中…");
    try {
      window._gClientId = clientId;
      const token = await getDriveToken();
      const existing = await findBackupFile(token);
      await saveJsonToDrive(token, buildBackup(), existing?.id);
      setDriveStatus("ok"); setDriveMsg("Google Driveに保存しました ✓");
    } catch(err) {
      setDriveStatus("error"); setDriveMsg("エラー: " + err.message);
    }
  }

  // ── Google Drive: 読み込み
  async function loadFromDrive() {
    setDriveStatus("loading"); setDriveMsg("Google Driveから読み込み中…");
    try {
      window._gClientId = clientId;
      const token = await getDriveToken();
      const file = await findBackupFile(token);
      if (!file) { setDriveStatus("error"); setDriveMsg("バックアップファイルが見つかりません"); return; }
      const data = await loadJsonFromDrive(token, file.id);
      restoreBackup(data);
      setDriveStatus("ok"); setDriveMsg(`読み込み完了 ✓（保存日時: ${new Date(data.savedAt).toLocaleString("ja-JP")}）`);
    } catch(err) {
      setDriveStatus("error"); setDriveMsg("エラー: " + err.message);
    }
  }

  const statusColor = driveStatus==="ok" ? "#4ade80" : driveStatus==="error" ? "#f87171" : "#94a3b8";

  return (
    <div style={styles.section}>
      {/* ── バックアップ ── */}
      <div style={styles.card}>
        <h3 style={styles.cardTitle}>バックアップ / データ連携</h3>

        {/* CSV出力 */}
        <p style={styles.sectionSubtitle}>CSV出力</p>
        <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
          <button onClick={()=>exportCSV(transactions,fixedCosts,selYear,selMonth)} style={styles.driveBtn}>
            ⬇ 当月CSV ({selYear}年{MONTHS[selMonth]})
          </button>
          <button onClick={()=>exportCSV(transactions,fixedCosts,selYear,null)} style={styles.driveBtn}>
            ⬇ {selYear}年 全月CSV
          </button>
        </div>

        {/* ローカル JSON */}
        <p style={styles.sectionSubtitle}>JSONバックアップ（ローカル）</p>
        <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
          <button onClick={exportJSON} style={styles.driveBtn}>⬇ JSONをダウンロード</button>
          <label style={{...styles.driveBtn,cursor:"pointer"}}>
            ⬆ JSONを取り込む
            <input type="file" accept=".json" onChange={importJSON} style={{display:"none"}} />
          </label>
        </div>

        {/* CSV インポート */}
        <p style={styles.sectionSubtitle}>CSVインポート（Numbers / Excel編集後）</p>
        <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
          <label style={{...styles.driveBtn,cursor:"pointer"}}>
            ⬆ CSVを取り込む
            <input type="file" accept=".csv" onChange={importCSV} style={{display:"none"}} />
          </label>
        </div>

        {/* Google Drive */}
        <p style={styles.sectionSubtitle}>Google Drive連携</p>
        <div style={{marginBottom:10}}>
          <button onClick={()=>setShowClientId(v=>!v)} style={{...styles.driveBtn,background:"#1e293b",color:"#64748b",fontSize:11}}>
            {showClientId ? "▲ クライアントID設定を閉じる" : "▼ クライアントID設定"}
          </button>
        </div>
        {showClientId && (
          <div style={{marginBottom:14,padding:14,background:"#0b1120",borderRadius:10,border:"1px solid #1e293b"}}>
            <p style={{fontSize:11,color:"#64748b",marginBottom:8,lineHeight:1.7}}>
              Google Cloud ConsoleでOAuthクライアントIDを作成し（種別: ウェブアプリケーション）、<br/>
              「承認済みのJavaScriptオリジン」にアプリのURLを追加してください。
            </p>
            <div style={{display:"flex",gap:8}}>
              <input
                value={clientId}
                onChange={e=>setClientId(e.target.value)}
                placeholder="xxxxx.apps.googleusercontent.com"
                style={{...styles.input,flex:1,fontSize:12}}
              />
              <button onClick={saveClientId} style={styles.addBtn}>保存</button>
            </div>
          </div>
        )}
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button onClick={saveToDrive} disabled={driveStatus==="loading"||!clientId} style={{...styles.driveBtn,opacity:(!clientId||driveStatus==="loading")?0.4:1}}>
            ☁ Driveに保存
          </button>
          <button onClick={loadFromDrive} disabled={driveStatus==="loading"||!clientId} style={{...styles.driveBtn,opacity:(!clientId||driveStatus==="loading")?0.4:1}}>
            ☁ Driveから読み込み
          </button>
        </div>
        {driveMsg && <p style={{fontSize:12,color:statusColor,marginTop:10}}>{driveMsg}</p>}
      </div>

      {/* ── カテゴリ ── */}
      <CategorySection
        title="収入カテゴリ"
        cats={incomeCats} catColors={catColors}
        newVal={newIncome} setNewVal={setNewIncome}
        onAdd={()=>addCat("income")} onRemove={name=>removeCat("income",name)} onColorChange={changeColor}
      />
      <CategorySection
        title="支出カテゴリ"
        cats={expenseCats} catColors={catColors}
        newVal={newExpense} setNewVal={setNewExpense}
        onAdd={()=>addCat("expense")} onRemove={name=>removeCat("expense",name)} onColorChange={changeColor}
      />

      {/* ── バージョン情報 ── */}
      <div style={{...styles.card,textAlign:"center",padding:"16px 20px"}}>
        <div style={{fontSize:12,color:"#334155",letterSpacing:"0.05em"}}>
          家計簿アプリ　v{APP_VERSION}
        </div>
        <div style={{fontSize:11,color:"#1e3a5f",marginTop:4}}>
          {APP_VERSION_DATE}
        </div>
      </div>
    </div>
  );
}

function CategorySection({title,cats,catColors,newVal,setNewVal,onAdd,onRemove,onColorChange}) {
  return (
    <div style={styles.card}>
      <h3 style={styles.cardTitle}>{title}</h3>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <input
          value={newVal}
          onChange={e=>setNewVal(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&onAdd()}
          placeholder="新しいカテゴリ名"
          style={{...styles.input,flex:1}}
        />
        <button onClick={onAdd} style={styles.addBtn}>追加</button>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:0}}>
        {cats.map(cat=>(
          <div key={cat} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 0",borderBottom:"1px solid #1e293b"}}>
            {/* カラーピッカー（カラーサークルをクリックで色変更） */}
            <div style={{position:"relative",flexShrink:0,width:24,height:24}}>
              <div style={{
                width:24,height:24,borderRadius:8,
                background:catColors[cat]||"#94a3b8",
                border:"2px solid #334155",
                cursor:"pointer",
              }} />
              <input
                type="color"
                value={catColors[cat]||"#94a3b8"}
                onChange={e=>onColorChange(cat,e.target.value)}
                style={{position:"absolute",inset:0,opacity:0,cursor:"pointer",width:"100%",height:"100%",padding:0,border:"none"}}
                title="色を変更"
              />
            </div>
            <span style={{flex:1,color:"#f1f5f9",fontSize:14}}>{cat}</span>
            <button onClick={()=>onRemove(cat)} style={{...styles.delBtn,color:"#ef4444",borderColor:"#7f1d1d"}}>×</button>
          </div>
        ))}
        {cats.length===0 && <p style={{color:"#475569",fontSize:13,textAlign:"center",padding:"16px 0"}}>カテゴリがありません</p>}
      </div>
      <p style={{fontSize:11,color:"#334155",marginTop:10}}>● をタップすると色を変更できます</p>
    </div>
  );
}
